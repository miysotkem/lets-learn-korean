<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Let's Learn Korean/title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
  <!-- LỚP PHỦ MỜ KHI MỞ MENU CẠNH -->
  <div class="drawer-backdrop hidden" id="drawer-backdrop"></div>

  <!-- THANH MENU TRƯỢT BÊN CẠNH -->
  <aside class="side-drawer" id="side-drawer">
    <div class="drawer-header">
      <span class="drawer-title">⚙️Cài đặt</span>
      <button class="sketch-pill small-btn" id="btn-close-menu">✕ Đóng</button>
    </div>

    <div class="drawer-section">
      <div class="note-label">★ Chọn chủ đề bài học:</div>
      <div class="topic-list" id="topic-list"></div>
    </div>

    <div class="drawer-section">
      <div class="note-label">★ Trợ lý AI Luyện Nói & Chấm Viết:</div>
      <p class="drawer-hint">Dán Gemini API Key (miễn phí tại Google AI Studio) để AI chấm chữa câu tiếng Hàn và hội thoại cùng bạn:</p>
      <input type="password" id="ai-key-input" class="sketch-input" placeholder="Dán mã AIzaSy... vào đây" />
      <div style="display:flex; gap:8px; margin-top:8px;">
        <button class="sketch-pill small-btn" id="btn-save-key">Lưu Key</button>
        <button class="sketch-pill small-btn" id="btn-clear-key">Xóa Key</button>
      </div>
      <div class="ai-key-status" id="ai-key-status"></div>
    </div>
  </aside>

  <!-- KHUNG GIAO DIỆN CHÍNH Ở GIỮA -->
  <div class="app-wrapper">
    <header class="site-header">
      <button class="art-btn menu-toggle-btn" id="btn-open-menu" title="Mở danh sách chủ đề">
        <img src="images/btn-menu.png" alt="Menu"
             onload="this.parentElement.classList.add('has-art')"
             onerror="this.remove()">
        <span class="fallback-label">☰ Chủ đề</span>
      </button>

      <div class="banner-box">
        <img src="images/banner-title.png" alt="Let's Learn Korean"
             onload="this.parentElement.classList.add('has-art')"
             onerror="this.remove()">
        <h1 class="fallback-banner">Let's Learn Korean</h1>
      </div>
    </header>

    <div class="current-topic-bar">
      <span>Chủ đề: </span>
      <span id="active-topic-name" class="pink-highlight">Tất cả chủ đề</span>
    </div>

    <!-- 3 TAB CHÍNH -->
    <nav class="nav-tabs">
      <button class="art-btn tab-btn active" data-tab="vocab">
        <img src="images/tab-vocab.png" alt="Từ vựng"
             onload="this.parentElement.classList.add('has-art')"
             onerror="this.remove()">
        <span class="fallback-label">Từ vựng</span>
      </button>

      <button class="art-btn tab-btn" data-tab="grammar">
        <img src="images/tab-grammar.png" alt="Ngữ pháp"
             onload="this.parentElement.classList.add('has-art')"
             onerror="this.remove()">
        <span class="fallback-label">Ngữ pháp</span>
      </button>

      <button class="art-btn tab-btn" data-tab="skills">
        <img src="images/tab-skills.png" alt="4 Kỹ năng"
             onload="this.parentElement.classList.add('has-art')"
             onerror="this.remove()">
        <span class="fallback-label">4 Kỹ năng</span>
      </button>
    </nav>

    <main class="main-content">

      <!-- TAB 1: TỪ VỰNG -->
      <section id="sec-vocab" class="tab-section active">
        <div id="vocab-flashcard-view">
          <div class="card-counter" id="card-counter">1 / 1</div>

          <div class="flashcard-stage">
            <div class="flashcard" id="flashcard">
              <div class="card-face card-front">
                <img class="frame-art" src="images/card-front.png" alt=""
                     onload="this.parentElement.classList.add('has-frame')"
                     onerror="this.remove()">
                <div class="card-inner">
                  <span class="topic-tag" id="card-topic-tag">Đời sống</span>
                  <div class="vocab-img-wrap" id="vocab-img-wrap"></div>
                  <div class="korean-word" id="card-korean"></div>
                  <div class="roman-hint" id="card-roman"></div>
                </div>
              </div>

              <div class="card-face card-back">
                <img class="frame-art" src="images/card-back.png" alt=""
                     onload="this.parentElement.classList.add('has-frame')"
                     onerror="this.remove()">
                <div class="card-inner">
                  <div class="meaning-word" id="card-meaning"></div>
                  <div class="note-pill" id="card-note"></div>
                  <div class="example-box">
                    <p class="example-kr" id="card-ex-kr"></p>
                    <p class="example-vi" id="card-ex-vi"></p>
                  </div>
                  <button class="sketch-pill small-btn" id="btn-speak-ex">🔊 Nghe câu ví dụ</button>
                </div>
              </div>
            </div>
          </div>

          <div class="card-controls">
            <button class="art-btn ctrl-btn" id="btn-prev" title="Thẻ trước">
              <img src="images/btn-prev.png" alt="Trước"
                   onload="this.parentElement.classList.add('has-art')"
                   onerror="this.remove()">
              <span class="fallback-label">◀</span>
            </button>

            <button class="art-btn ctrl-btn" id="btn-speak" title="Nghe phát âm chuẩn">
              <img src="images/btn-speak.png" alt="Nghe"
                   onload="this.parentElement.classList.add('has-art')"
                   onerror="this.remove()">
              <span class="fallback-label">🔊</span>
            </button>

            <button class="art-btn ctrl-btn" id="btn-speak-slow" title="Nghe đọc chậm">
              <img src="images/btn-speak-slow.png" alt="Chậm"
                   onload="this.parentElement.classList.add('has-art')"
                   onerror="this.remove()">
              <span class="fallback-label">🐢</span>
            </button>

            <button class="art-btn ctrl-btn wide-btn" id="btn-flip" title="Lật thẻ">
              <img src="images/btn-flip.png" alt="Lật thẻ"
                   onload="this.parentElement.classList.add('has-art')"
                   onerror="this.remove()">
              <span class="fallback-label">↻ Lật thẻ</span>
            </button>

            <button class="art-btn ctrl-btn" id="btn-next" title="Thẻ sau">
              <img src="images/btn-next.png" alt="Sau"
                   onload="this.parentElement.classList.add('has-art')"
                   onerror="this.remove()">
              <span class="fallback-label">▶</span>
            </button>
          </div>
        </div>
      </section>

      <!-- TAB 2: NGỮ PHÁP -->
      <section id="sec-grammar" class="tab-section">
        <div class="sub-switch">
          <button class="sketch-pill active" data-gsub="topic">Theo chủ đề</button>
          <button class="sketch-pill" data-gsub="spoken">Giao tiếp</button>
          <button class="sketch-pill" data-gsub="written">Văn viết</button>
          <button class="sketch-pill" data-gsub="compare">So sánh</button>
          <button class="sketch-pill" data-gsub="practice">✎ Luyện tập</button>
        </div>
        <div id="grammar-content"></div>
      </section>

      <!-- TAB 3: 4 KỸ NĂNG -->
      <section id="sec-skills" class="tab-section">
        <div class="sub-switch">
          <button class="sketch-pill active" data-skill="listening">Nghe (듣기)</button>
          <button class="sketch-pill" data-skill="speaking">Nói (말하기)</button>
          <button class="sketch-pill" data-skill="reading">Đọc (읽기)</button>
          <button class="sketch-pill" data-skill="writing">Viết (쓰기)</button>
        </div>
        <div id="skill-content"></div>
      </section>

    </main>
  </div>

  <script src="data.js?v=4"></script>
  <script src="app.js?v=4"></script>
</body>
</html>

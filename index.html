<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Let's Learn Korean</title>
  <!-- Font chữ viết tay cho tiếng Việt và tiếng Hàn -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-wrapper">
    <!-- 1. BẢNG TÊN TRANG WEB (banner-title.png) -->
    <header class="site-header">
      <div class="banner-box">
        <img src="images/banner-title.png" alt="Let's Learn Korean"
             onload="this.parentElement.classList.add('has-art')"
             onerror="this.remove()">
        <h1 class="fallback-banner">✎ Let's Learn Korean</h1>
      </div>
    </header>

    <!-- 2. BỐN NÚT CHUYỂN CHẾ ĐỘ HỌC (tab-*.png) -->
    <nav class="nav-tabs">
      <button class="art-btn tab-btn active" data-tab="vocab">
        <img src="images/tab-vocab.png" alt="Từ vựng"
             onload="this.parentElement.classList.add('has-art')"
             onerror="this.remove()">
        <span class="fallback-label">Từ vựng</span>
      </button>

      <button class="art-btn tab-btn" data-tab="grammar">
        <img src="images/tab-grammar.png" alt="Ngữ pháp"
             onload="this.parentElement.classList.add('has-art')"
             onerror="this.remove()">
        <span class="fallback-label">Ngữ pháp</span>
      </button>

      <button class="art-btn tab-btn" data-tab="skills">
        <img src="images/tab-skills.png" alt="4 Kỹ năng"
             onload="this.parentElement.classList.add('has-art')"
             onerror="this.remove()">
        <span class="fallback-label">4 Kỹ năng</span>
      </button>

      <button class="art-btn tab-btn" data-tab="topik">
        <img src="images/tab-topik.png" alt="TOPIK"
             onload="this.parentElement.classList.add('has-art')"
             onerror="this.remove()">
        <span class="fallback-label">TOPIK</span>
      </button>
    </nav>

    <!-- 3. KHU VỰC NỘI DUNG CHÍNH -->
    <main class="main-content">
      <!-- TAB 1: TỪ VỰNG (FLASHCARD + QUIZ) -->
      <section id="sec-vocab" class="tab-section active">
        <div class="sub-switch">
          <button class="sketch-pill active" id="mode-flashcard">Thẻ lật (Flashcard)</button>
          <button class="sketch-pill" id="mode-quiz">Đố vui (Quiz)</button>
        </div>

        <!-- Chế độ Flashcard -->
        <div id="vocab-flashcard-view">
          <div class="card-counter" id="card-counter">1 / 3</div>

          <div class="flashcard-stage">
            <div class="flashcard" id="flashcard">
              <!-- Mặt trước thẻ (card-front.png) -->
              <div class="card-face card-front">
                <img class="frame-art" src="images/card-front.png" alt=""
                     onload="this.parentElement.classList.add('has-frame')"
                     onerror="this.remove()">
                <div class="card-inner">
                  <div class="vocab-img-wrap" id="vocab-img-wrap"></div>
                  <div class="korean-word" id="card-korean">커피를 마시다</div>
                  <div class="roman-hint" id="card-roman">keo-pi-reul ma-si-da</div>
                </div>
              </div>

              <!-- Mặt sau thẻ (card-back.png) -->
              <div class="card-face card-back">
                <img class="frame-art" src="images/card-back.png" alt=""
                     onload="this.parentElement.classList.add('has-frame')"
                     onerror="this.remove()">
                <div class="card-inner">
                  <div class="meaning-word" id="card-meaning">Uống cà phê</div>
                  <div class="example-box">
                    <p class="example-kr" id="card-ex-kr"></p>
                    <p class="example-vi" id="card-ex-vi"></p>
                  </div>
                  <button class="sketch-pill small-btn" id="btn-speak-ex">🔊 Nghe câu ví dụ</button>
                </div>
              </div>
            </div>
          </div>

          <!-- 4 nút điều khiển thẻ (btn-prev, btn-speak, btn-flip, btn-next) -->
          <div class="card-controls">
            <button class="art-btn ctrl-btn" id="btn-prev" title="Thẻ trước">
              <img src="images/btn-prev.png" alt="Trước"
                   onload="this.parentElement.classList.add('has-art')"
                   onerror="this.remove()">
              <span class="fallback-label">◀</span>
            </button>

            <button class="art-btn ctrl-btn" id="btn-speak" title="Nghe phát âm">
              <img src="images/btn-speak.png" alt="Nghe"
                   onload="this.parentElement.classList.add('has-art')"
                   onerror="this.remove()">
              <span class="fallback-label">🔊</span>
            </button>

            <button class="art-btn ctrl-btn wide-btn" id="btn-flip" title="Lật thẻ">
              <img src="images/btn-flip.png" alt="Lật thẻ"
                   onload="this.parentElement.classList.add('has-art')"
                   onerror="this.remove()">
              <span class="fallback-label">↻ Lật thẻ</span>
            </button>

            <button class="art-btn ctrl-btn" id="btn-next" title="Thẻ sau">
              <img src="images/btn-next.png" alt="Sau"
                   onload="this.parentElement.classList.add('has-art')"
                   onerror="this.remove()">
              <span class="fallback-label">▶</span>
            </button>
          </div>
        </div>

        <!-- Chế độ Quiz từ vựng -->
        <div id="vocab-quiz-view" class="hidden">
          <div class="quiz-prompt-box" id="quiz-prompt"></div>
          <div class="quiz-options" id="quiz-options"></div>
          <div class="quiz-feedback" id="quiz-feedback"></div>
          <button class="sketch-pill" id="btn-next-quiz">Câu tiếp theo ➔</button>
        </div>
      </section>

      <!-- TAB 2: NGỮ PHÁP -->
      <section id="sec-grammar" class="tab-section"></section>

      <!-- TAB 3: 4 KỸ NĂNG -->
      <section id="sec-skills" class="tab-section">
        <div class="sub-switch">
          <button class="sketch-pill active" data-skill="listening">Nghe</button>
          <button class="sketch-pill" data-skill="speaking">Nói</button>
          <button class="sketch-pill" data-skill="reading">Đọc</button>
          <button class="sketch-pill" data-skill="writing">Viết</button>
        </div>
        <div id="skill-content"></div>
      </section>

      <!-- TAB 4: LUYỆN ĐỀ TOPIK -->
      <section id="sec-topik" class="tab-section"></section>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
